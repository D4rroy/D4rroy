name: Android-APK bauen

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'macro-creator/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: macro-creator/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleRelease

      - name: APK bereitstellen
        run: cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/MakroStudio.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MakroStudio-apk
          path: ${{ runner.temp }}/MakroStudio.apk

      - name: Als Release „apk-latest“ veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest "$RUNNER_TEMP/MakroStudio.apk" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Makro Studio – neueste APK" \
            --notes "Automatisch gebaut aus ${GITHUB_REF_NAME} (${GITHUB_SHA::7}), Build ${{ github.run_number }}. Auf dem Handy MakroStudio.apk herunterladen und installieren."
