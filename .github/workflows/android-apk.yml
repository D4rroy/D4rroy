name: Android-APK bauen

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'macro-creator/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test auf Android-Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: KVM für den Emulator freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumentierte Tests ausführen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: macro-creator/android
          script: ./gradlew --no-daemon connectedDebugAndroidTest && adb logcat -d -s IntervalTriggerTest:I BackgroundServiceTest:I

      - name: Testbericht hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-testbericht
          path: macro-creator/android/app/build/reports/androidTests/

  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: macro-creator/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleRelease

      - name: APK bereitstellen
        run: cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/MakroStudio.apk"

      - name: Einrichtungsanleitung als PDF erzeugen
        working-directory: macro-creator
        run: |
          python3 -m http.server 8099 > /dev/null 2>&1 &
          sleep 2
          google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer --virtual-time-budget=5000 \
            --print-to-pdf="$RUNNER_TEMP/Makro-Studio-Einrichtungsanleitung.pdf" "http://localhost:8099/#/guide"
          test -s "$RUNNER_TEMP/Makro-Studio-Einrichtungsanleitung.pdf"

      - uses: actions/upload-artifact@v4
        with:
          name: MakroStudio-apk
          path: |
            ${{ runner.temp }}/MakroStudio.apk
            ${{ runner.temp }}/Makro-Studio-Einrichtungsanleitung.pdf

      - name: Als Release „apk-latest“ veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest "$RUNNER_TEMP/MakroStudio.apk" "$RUNNER_TEMP/Makro-Studio-Einrichtungsanleitung.pdf" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Makro Studio – neueste APK" \
            --notes "Automatisch gebaut aus ${GITHUB_REF_NAME} (${GITHUB_SHA::7}), Build ${{ github.run_number }}. Auf dem Handy MakroStudio.apk herunterladen und installieren. Die Einrichtungsanleitung (PDF) erklärt Installation, Hintergrundbetrieb und alle Berechtigungen."
